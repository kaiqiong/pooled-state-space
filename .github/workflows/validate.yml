name: Numerical smoke checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical-check dependency
        run: Rscript -e 'install.packages("numDeriv", repos="https://cloud.r-project.org")'
      - name: Check source integrity
        run: python3 scripts/validate_release.py
      - name: Run small independent checks
        run: python3 run.py smoke
